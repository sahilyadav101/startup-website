<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyVision Admin Dashboard</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            background:#f4f4f4;
            padding:30px;
        }

        h1{
            text-align:center;
        }

        table{
            width:100%;
            border-collapse:collapse;
            background:white;
        }

        th, td{
            border:1px solid #ddd;
            padding:12px;
            text-align:left;
        }

        th{
            background:#111;
            color:white;
        }

        tr:nth-child(even){
            background:#f9f9f9;
        }
        .stats{
            display:flex;
            justify-content:center;
            margin-bottom:20px;
        }

        .card{
            background:white;
            padding:20px;
        border-radius:10px;
        width:250px;
        text-align:center;
        box-shadow:0 0 10px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <div class="stats">
    <div class="card">
        <h2 id="totalLeads">0</h2>
        <p>Total Leads</p>
    </div>
</div>

<h1>SkyVision Leads Dashboard</h1>
    <h1>SkyVision Leads Dashboard</h1>

<button onclick="logout()">
    Logout
</button>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Message</th>
                <th>Date</th>
            </tr>
        </thead>

        <tbody id="tableBody">
        </tbody>
    </table>

    <script>

        const token = localStorage.getItem("token");

        if (!token) {
            window.location.href = "login.html";
        }

        function logout() {
            localStorage.removeItem("token");
            window.location.href = "login.html";
        }

        async function loadLeads() {

            try {

                const response = await fetch(
                "https://skyvision-api2.onrender.com/leads",
                {
                    headers: {
                        Authorization: `Bearer ${token}`
                    }
                }
            );

            const leads = await response.json();

            if (!Array.isArray(leads)) {
                alert("Session expired. Please login again.");
                localStorage.removeItem("token");
                window.location.href = "login.html";
                return;
        }

        document.getElementById("totalLeads").innerText =
            leads.length;

        const tableBody =
            document.getElementById("tableBody");

        tableBody.innerHTML = "";

        leads.forEach((lead) => {

            tableBody.innerHTML += `
                <tr>
                    <td>${lead.id}</td>
                    <td>${lead.name}</td>
                    <td>${lead.email}</td>
                    <td>${lead.message}</td>
                    <td>${new Date(
                        lead.created_at
                    ).toLocaleString()}</td>
                </tr>
            `;
        });

    } catch (error) {

        console.error("Error loading leads:", error);

        alert("Please login again.");

        localStorage.removeItem("token");

        window.location.href = "login.html";
    }
}

loadLeads();

</script>

</body>
</html>
